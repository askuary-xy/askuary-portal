# ASKUARY — Nginx 反代样例（宝塔 / 裸机均可参考）
#
# 要点：
# 1) API 容器只绑 127.0.0.1:8787，勿对公网直接暴露 8787
# 2) 前台静态站与 /api、/admin 同域，避免多余 CORS
# 3) 生产务必在 api/.env 填写 CORS_ORIGINS（若前后端分域）
#
# 请按实际域名、证书路径、站点根目录修改后使用。

# --- HTTP → HTTPS（可选）---
# server {
#   listen 80;
#   server_name www.askuary.cn askuary.cn;
#   return 301 https://$host$request_uri;
# }

server {
  listen 443 ssl http2;
  server_name www.askuary.cn askuary.cn;

  # ssl_certificate     /path/to/fullchain.pem;
  # ssl_certificate_key /path/to/privkey.pem;

  # 静态站根（构建后的 dist/）
  root /www/wwwroot/118_89_196_45;
  index index.html;

  # 安全头（可按需调整）
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # API + 后台（Nest 容器）
  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 上传封面等可按需放大
    client_max_body_size 20m;
  }

  location /admin/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA / 多页静态：优先文件，否则目录 index
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # 缓存静态资源示例
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|mp4|mp3)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
