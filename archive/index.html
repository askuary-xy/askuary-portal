<!doctype html>
<html lang="zh-CN" class="footprint-subpage-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1020" />
    <meta name="description" content="归档 — ASKUARY 记忆图书馆" />
    <title>归档 · ASKUARY</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="alternate" type="application/rss+xml" title="ASKUARY RSS" href="/rss.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="fp-about-page fp-blog-page fp-archive-page home-hub-page archive-rich-page">
    <div class="fp-atmosphere" aria-hidden="true"></div>
    <canvas id="fpStars" class="fp-stars-canvas" aria-hidden="true"></canvas>
    <!-- 边缘漂浮装饰 -->
    <div class="archive-deco" aria-hidden="true">
      <span class="archive-deco-item archive-deco-item--1">✦</span>
      <span class="archive-deco-item archive-deco-item--2">☁</span>
      <span class="archive-deco-item archive-deco-item--3">♪</span>
      <span class="archive-deco-item archive-deco-item--4">✧</span>
    </div>

    <main class="fp-about fp-blog fp-archive archive-rich" aria-labelledby="archiveTitle">
      <header class="archive-hero">
        <p class="archive-kicker">Memory Library</p>
        <h1 class="fp-about-title" id="archiveTitle">归档</h1>
        <p class="archive-stats" id="archiveStats">📝 共 — 篇文章 · 跨越 — 个月</p>
        <p class="fp-about-lead" id="archiveLead" hidden></p>
        <button type="button" class="archive-random-btn" id="archiveRandomBtn" aria-label="随机一篇">
          <span class="archive-random-dice" id="archiveRandomDice" aria-hidden="true">🎲</span>
          <span>随机一篇</span>
        </button>
      </header>

      <!-- 月份快捷跳转 -->
      <nav class="archive-months" id="archiveMonths" aria-label="按月份跳转" hidden></nav>

      <!-- 标签筛选 -->
      <nav class="fp-archive-tags archive-tags" id="archiveTags" aria-label="按标签筛选" hidden></nav>

      <!-- 视图切换 -->
      <div class="archive-view-bar">
        <div class="archive-view-toggle" role="group" aria-label="视图切换">
          <button type="button" class="archive-view-btn is-active" data-view="cards" id="viewCardsBtn">卡片视图</button>
          <button type="button" class="archive-view-btn" data-view="timeline" id="viewTimelineBtn">时间轴视图</button>
        </div>
      </div>

      <div class="archive-stage" id="archiveStage">
        <div class="archive-view is-active" id="archiveCardView" data-panel="cards"></div>
        <div class="archive-view" id="archiveTimelineView" data-panel="timeline" hidden></div>
      </div>

      <div class="archive-more-wrap">
        <button type="button" class="archive-load-more" id="archiveLoadMore" hidden>加载更多</button>
      </div>

      <p class="fp-blog-empty" id="archiveEmpty" hidden></p>
      <nav class="fp-about-links" id="archiveLinks" aria-label="相关链接"></nav>
    </main>

    <footer class="home-hub-footer">
      <div class="home-hub-footer-inner" id="pageLegal"></div>
    </footer>

    <div id="bootError" hidden></div>
    <script type="module" src="/src/pages/archive/main.ts"></script>
  </body>
</html>
