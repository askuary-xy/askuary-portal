<!doctype html>
<html lang="zh-CN" class="footprint-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="ASKUARY — 记录思考，探索次元" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ASKUARY" />
    <meta property="og:title" content="ASKUARY" />
    <meta property="og:description" content="记录思考，探索次元" />
    <meta property="og:url" content="https://www.askuary.cn/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ASKUARY" />
    <meta name="twitter:description" content="记录思考，探索次元" />
    <title>ASKUARY</title>
    <link rel="canonical" href="https://www.askuary.cn/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate" type="application/rss+xml" title="ASKUARY RSS" href="/rss.xml" />
  </head>
  <body class="fp-journey">
    <div class="fp-app" id="footprintIntro">
      <div class="fp-atmosphere" aria-hidden="true"></div>

      <canvas id="fpStars" class="fp-stars-canvas" aria-hidden="true"></canvas>
      <canvas id="fpEarth" class="fp-earth-canvas" aria-hidden="true"></canvas>
      <div id="fpSkyTexts" class="fp-sky-texts" aria-live="polite"></div>
      <div class="fp-moon" aria-hidden="true"></div>

      <div id="fpBlackhole" class="fp-blackhole-scene" aria-hidden="true">
        <div class="fp-black-hole" role="button" tabindex="0" aria-label="黑洞，点击进入传送门">
          <video
            class="fp-black-hole-video"
            src="/media/blackhole.mp4"
            muted
            loop
            playsinline
            preload="metadata"
            aria-hidden="true"
          ></video>
        </div>
        <div class="fp-bh-veil" aria-hidden="true"></div>
        <span class="fp-black-hole-label">点击穿越</span>
      </div>

      <section class="fp-screen fp-screen--hero" aria-label="Intro">
        <div class="fp-starport-status" aria-label="星港连接状态">
          <strong>ASKUARY STARPORT</strong>
          <span>Archive link established</span>
        </div>
        <div class="fp-navigator" aria-hidden="true">
          <img
            class="fp-navigator-art"
            src="/brand/navigator-v3.webp"
            alt=""
            width="1024"
            height="1536"
            decoding="async"
          />
        </div>
        <div class="fp-hero-spacer" aria-hidden="true"></div>
        <div class="fp-profile">
          <h1 class="fp-title" id="siteName">ASKUARY</h1>
          <div class="fp-intro-text">
            <p class="fp-desc" id="siteIntro">记录思考，探索次元</p>
          </div>
          <nav class="fp-social" id="siteSocial" aria-label="Social links"></nav>
        </div>
        <p class="fp-scroll-hint" aria-hidden="true">
          <span class="fp-scroll-hint-label">下滑探索黑洞</span>
          <span class="fp-scroll-hint-arrow">↓</span>
        </p>
      </section>

      <section class="fp-screen fp-screen--hole" aria-label="Black hole">
        <aside id="fpAtlas" class="fp-atlas" aria-label="星图导航" hidden>
          <div class="fp-atlas-panel">
            <header class="fp-atlas-header">
              <h2 class="fp-atlas-title">星图导航</h2>
              <label class="fp-atlas-search-wrap">
                <span aria-hidden="true">⌕</span>
                <input
                  type="search"
                  id="fpAtlasSearch"
                  class="fp-atlas-search"
                  placeholder="搜索光点或友联…"
                  autocomplete="off"
                />
              </label>
            </header>
            <h3 class="fp-atlas-section-title">地球光点</h3>
            <ul id="fpAtlasList" class="fp-atlas-list" role="listbox" aria-label="光点列表"></ul>
            <div class="fp-atlas-friends-section" hidden>
              <h3 class="fp-atlas-section-title">友联卫星</h3>
              <ul
                id="fpAtlasFriendsList"
                class="fp-atlas-list fp-atlas-list--friends"
                role="listbox"
                aria-label="友联列表"
              ></ul>
            </div>
            <div id="fpAtlasDetail" class="fp-atlas-detail" hidden></div>
            <p class="fp-atlas-hint">选择条目后点击「定位到地球」回到首屏查看</p>
            <div id="portalLegal" class="fp-portal-legal" aria-label="备案信息"></div>
          </div>
        </aside>
      </section>

      <section class="fp-galaxy-experience" aria-label="ASKUARY 银河入口">
        <canvas id="fpGalaxyPointCloud" class="fp-galaxy-point-cloud" aria-hidden="true"></canvas>
        <canvas id="fpSolarSystemScene" class="fp-solar-system-scene" aria-hidden="true"></canvas>
        <canvas id="fpBlackholeSystemScene" class="fp-blackhole-system-scene" aria-hidden="true"></canvas>
        <canvas id="fpGalaxySystem" class="fp-galaxy-canvas" aria-label="可探索的银河与太阳系" role="img"></canvas>
        <div class="fp-galaxy-hud" aria-live="polite">
          <p class="fp-galaxy-hud__brand">ASKUARY / COSMIC ARCHIVE</p>
          <p class="fp-galaxy-hud__stage" id="fpGalaxyStage">MILKY WAY / LOCAL ARM</p>
        </div>
        <p class="fp-galaxy-hint" id="fpGalaxyHint">滚动或滑动，驶入太阳系</p>
        <p class="fp-blackhole-legal" id="fpBlackholeLegal" hidden>
          <a href="https://beian.mps.gov.cn/#/query/webSearch?code=31010502007431" target="_blank" rel="noreferrer">沪公网安备31010502007431号</a>
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">湘ICP备 2025131923号-1</a>
          <a href="https://icp.gov.moe/?keyword=20260154" target="_blank" rel="noreferrer">萌ICP备20260154号</a>
        </p>
        <aside class="fp-planet-panel" id="fpPlanetPanel" aria-live="polite" hidden></aside>
      </section>
    </div>

    <div id="navPanel" class="nav-panel" hidden role="dialog" aria-modal="true" aria-labelledby="navPanelTitle">
      <div class="nav-panel-card">
        <div class="nav-panel-icon" id="navPanelIcon" aria-hidden="true">✦</div>
        <h2 id="navPanelTitle"></h2>
        <p id="navPanelDesc"></p>
        <div class="nav-panel-actions">
          <button type="button" id="navPanelClose">关闭</button>
          <a id="navPanelLink" href="#">前往</a>
        </div>
      </div>
    </div>

    <div id="bootError" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
